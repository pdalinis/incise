name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.98.1"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      publish_npm: ${{ steps.release-scope.outputs.publish_npm }}
      npm_version: ${{ steps.release-scope.outputs.npm_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read release scope
        id: release-scope
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const scope = JSON.parse(fs.readFileSync(".github/release-scope.json", "utf8"));
          const tagVersion = process.env.GITHUB_REF_NAME.replace(/^v/, "");
          if (scope.version !== tagVersion) {
            throw new Error(`release scope ${scope.version} does not match tag ${tagVersion}`);
          }
          if (typeof scope.publishNpm !== "boolean") {
            throw new Error("release scope publishNpm must be boolean");
          }
          const npmVersion = scope.publishNpm ? tagVersion : scope.npmVersion;
          if (typeof npmVersion !== "string" || !npmVersion) {
            throw new Error("release scope must provide npmVersion when npm publication is disabled");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish_npm=${scope.publishNpm}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `npm_version=${npmVersion}\n`);
          NODE

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: plugins/pi/package-lock.json

      - name: Install trusted-publishing-compatible npm
        run: npm install --global npm@11.19.0

      - name: Verify tag matches workspace version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$tag_version" = "$cargo_version" || {
            echo "Tag version ($tag_version) does not match Cargo version ($cargo_version)"
            exit 1
          }

      - name: Verify npm package versions
        shell: bash
        env:
          NPM_VERSION: ${{ steps.release-scope.outputs.npm_version }}
        run: |
          node - "$NPM_VERSION" <<'NODE'
          const fs = require("node:fs");
          const expected = process.argv[2];
          const manifests = [
            "plugins/pi/package.json",
            "plugins/pi/native/darwin-arm64/package.json",
            "plugins/pi/native/darwin-x64/package.json",
            "plugins/pi/native/linux-arm64-gnu/package.json",
            "plugins/pi/native/linux-x64-gnu/package.json",
          ];
          for (const path of manifests) {
            const manifest = JSON.parse(fs.readFileSync(path, "utf8"));
            if (manifest.version !== expected) throw new Error(`${path} has ${manifest.version}, expected ${expected}`);
          }
          const main = JSON.parse(fs.readFileSync(manifests[0], "utf8"));
          for (const [name, version] of Object.entries(main.optionalDependencies)) {
            if (version !== expected) throw new Error(`${name} is pinned to ${version}, expected ${expected}`);
          }
          NODE

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Build CLI for integration tests
        run: cargo build -p incise-cli --locked

      - name: Run Python invariant suite
        run: python3 bench/test_incise_ops.py

      - name: Run differential test suite
        run: python3 bench/difftest.py

      - name: Check published schemas
        run: python3 bench/schematest.py

      - name: Check recorded-call replay agreement
        run: python3 bench/replaycheck.py

      - name: Test Hermes plugin adapter
        run: python3 plugins/hermes/test_plugin.py

      - name: Install Pi package development dependencies
        working-directory: plugins/pi
        run: npm ci --omit=optional

      - name: Test and type-check Pi package
        working-directory: plugins/pi
        run: |
          npm test
          npm run typecheck
          npm run pack:check

      - name: Pack main Pi package
        if: steps.release-scope.outputs.publish_npm == 'true'
        working-directory: plugins/pi
        run: |
          mkdir -p dist/npm
          npm pack --ignore-scripts --pack-destination dist/npm

      - name: Upload main Pi package
        if: steps.release-scope.outputs.publish_npm == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-incise-npm-main
          path: plugins/pi/dist/npm/*.tgz
          if-no-files-found: error

      - name: Verify incise-core package
        run: cargo package -p incise-core --locked

      - name: Verify incise-cli package contents
        run: cargo package -p incise-cli --locked --no-verify --list

  package:
    name: Package ${{ matrix.archive }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: x86_64-unknown-linux-gnu
            format: tar
            npm_dir: linux-x64-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: aarch64-unknown-linux-gnu
            format: tar
            npm_dir: linux-arm64-gnu
          - os: macos-14
            target: aarch64-apple-darwin
            archive: aarch64-apple-darwin
            format: tar
            npm_dir: darwin-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            archive: x86_64-apple-darwin
            format: tar
            npm_dir: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release -p incise-cli --locked --target ${{ matrix.target }}

      - name: Create Unix archive
        if: matrix.format == 'tar'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p staging dist
          cp "target/$TARGET/release/incise" README.md LICENSE staging/
          tar -C staging -czf "dist/incise-${GITHUB_REF_NAME}-${ARCHIVE}.tar.gz" incise README.md LICENSE

      - name: Pack native npm package
        if: needs.validate.outputs.publish_npm == 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          NPM_DIR: ${{ matrix.npm_dir }}
        run: |
          package_dir="plugins/pi/native/$NPM_DIR"
          mkdir -p "$package_dir/bin" dist/npm
          cp "target/$TARGET/release/incise" "$package_dir/bin/incise"
          chmod 755 "$package_dir/bin/incise"
          cp LICENSE "$package_dir/LICENSE"
          (
            cd "$package_dir"
            shasum -a 256 bin/incise > SHA256SUMS
          )
          npm pack --ignore-scripts --pack-destination dist/npm "./$package_dir"

      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incise-${{ matrix.archive }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload native npm package
        if: needs.validate.outputs.publish_npm == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-incise-npm-${{ matrix.npm_dir }}
          path: dist/npm/*.tgz
          if-no-files-found: error

  package-hermes:
    name: Package Hermes plugin
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create Hermes plugin archive
        shell: bash
        run: |
          mkdir -p staging/incise dist
          cp \
            plugins/hermes/__init__.py \
            plugins/hermes/plugin.yaml \
            plugins/hermes/README.md \
            plugins/hermes/runner.py \
            plugins/hermes/safety.py \
            plugins/hermes/safe_routed.py \
            plugins/hermes/schema_cache.py \
            staging/incise/
          cp LICENSE staging/incise/LICENSE
          tar -C staging -czf "dist/incise-hermes-${GITHUB_REF_NAME}.tar.gz" incise

      - name: Verify Hermes plugin archive
        shell: bash
        run: |
          tar -tzf "dist/incise-hermes-${GITHUB_REF_NAME}.tar.gz"
          test "$(tar -tzf "dist/incise-hermes-${GITHUB_REF_NAME}.tar.gz" | grep -c '^incise/$')" -eq 1
          test "$(tar -tzf "dist/incise-hermes-${GITHUB_REF_NAME}.tar.gz" | grep -c '^incise/plugin.yaml$')" -eq 1

      - name: Upload Hermes plugin archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incise-hermes
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish crates
    needs: [validate, package, package-hermes]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.1"

      - name: Publish incise-core
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl --fail --silent --show-error --user-agent "incise-release-workflow" \
            "https://crates.io/api/v1/crates/incise-core/$version" >/dev/null; then
            echo "incise-core $version is already published"
          else
            cargo publish -p incise-core --locked
          fi

      - name: Publish incise-cli after registry propagation
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if curl --fail --silent --show-error --user-agent "incise-release-workflow" \
            "https://crates.io/api/v1/crates/incise-cli/$version" >/dev/null; then
            echo "incise-cli $version is already published"
            exit 0
          fi
          for attempt in {1..12}; do
            cargo publish -p incise-cli --locked && exit 0
            if [ "$attempt" -eq 12 ]; then
              exit 1
            fi
            echo "incise-core is not visible yet; retrying in 10 seconds"
            sleep 10
          done

  publish-npm:
    name: Publish Pi packages to next
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skip npm publication for this release
        if: needs.validate.outputs.publish_npm != 'true'
        run: echo "Release scope keeps Pi packages at ${{ needs.validate.outputs.npm_version }}"

      - name: Checkout repository
        if: needs.validate.outputs.publish_npm == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        if: needs.validate.outputs.publish_npm == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          registry-url: https://registry.npmjs.org

      - name: Install trusted-publishing-compatible npm
        if: needs.validate.outputs.publish_npm == 'true'
        run: npm install --global npm@11.19.0

      - name: Download npm packages
        if: needs.validate.outputs.publish_npm == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pi-incise-npm-*
          path: dist/npm
          merge-multiple: true

      - name: Publish native packages, then main package
        if: needs.validate.outputs.publish_npm == 'true'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          publish_if_missing() {
            name="$1"
            archive="$2"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "$archive" --access public --tag next --provenance
            fi
          }
          publish_if_missing "@pdalinis/pi-incise-darwin-arm64" "dist/npm/pdalinis-pi-incise-darwin-arm64-$version.tgz"
          publish_if_missing "@pdalinis/pi-incise-darwin-x64" "dist/npm/pdalinis-pi-incise-darwin-x64-$version.tgz"
          publish_if_missing "@pdalinis/pi-incise-linux-arm64-gnu" "dist/npm/pdalinis-pi-incise-linux-arm64-gnu-$version.tgz"
          publish_if_missing "@pdalinis/pi-incise-linux-x64-gnu" "dist/npm/pdalinis-pi-incise-linux-x64-gnu-$version.tgz"
          publish_if_missing "pi-incise" "dist/npm/pi-incise-$version.tgz"

  github-release:
    name: Create GitHub release
    needs: [package, package-hermes, publish, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: incise-*
          path: dist
          merge-multiple: true

      - name: Generate checksums and release notes
        shell: bash
        run: |
          cd dist
          sha256sum incise-* > SHA256SUMS
          cd ..
          notes_file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            cp "$notes_file" release-notes.md
          else
            previous_tag="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [ -n "$previous_tag" ]; then
              git log --pretty=format:"- %s (%h)" "$previous_tag..HEAD" > release-notes.md
            else
              git log --pretty=format:"- %s (%h)" > release-notes.md
            fi
          fi

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release-notes.md
          draft: false
          prerelease: false

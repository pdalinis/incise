[workspace]
resolver = "2"
members = ["crates/incise-core", "crates/incise-cli"]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Peter Dalinis"]
repository = "https://github.com/pdalinis/incise"
homepage = "https://pdalinis.github.io/incise/"

[profile.release]
opt-level = 3
lto = true
